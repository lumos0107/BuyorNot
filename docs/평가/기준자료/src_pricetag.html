<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#c9c2b6;font-family:"Malgun Gothic",sans-serif;}
.wrap{width:900px;height:620px;position:relative;background:linear-gradient(135deg,#d8d1c4,#bdb5a7);overflow:hidden}
.shelf{position:absolute;left:0;right:0;bottom:0;height:120px;background:#8b8f94}
.tag{position:absolute;left:150px;top:90px;width:560px;height:380px;background:#fffbe6;border:6px solid #d62828;transform:rotate(-2.2deg);box-shadow:6px 8px 14px rgba(0,0,0,.35);padding:22px 28px;box-sizing:border-box}
.brand{font-size:22px;color:#444}
.name{font-size:40px;font-weight:700;margin:6px 0 4px;color:#111}
.spec{font-size:22px;color:#555;margin-bottom:12px}
.old{font-size:24px;color:#777;text-decoration:line-through}
.price{font-size:92px;font-weight:800;color:#d62828;line-height:1.05}
.price small{font-size:40px}
.inst{font-size:21px;color:#333;margin-top:6px}
.foot{position:absolute;right:26px;bottom:14px;font-size:16px;color:#666}
</style></head><body>
<div class="wrap"><div class="shelf"></div>
<div class="tag">
 <div class="brand">전자랜드 · 모바일/오디오</div>
 <div class="name">Apple 에어팟 프로 2세대</div>
 <div class="spec">USB-C · MTJV3KH/A · 자급제</div>
 <div class="old">정상가 359,000원</div>
 <div class="price">329,000<small>원</small></div>
 <div class="inst">카드 12개월 무이자 월 27,417원</div>
 <div class="foot">행사기간 10.25 ~ 11.07</div>
</div></div></body></html>
