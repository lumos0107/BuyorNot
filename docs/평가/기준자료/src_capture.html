<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#fff;font-family:"Malgun Gothic",sans-serif;color:#222}
.page{width:390px;padding:0 0 20px}
.bar{height:44px;background:#f5f5f5;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 14px;font-size:15px;color:#555}
.hero{height:220px;background:linear-gradient(135deg,#e8dfd2,#cdbfa8);display:flex;align-items:center;justify-content:center;font-size:20px;color:#6b5a3e}
.title{padding:14px;font-size:19px;font-weight:700;line-height:1.35}
.price{padding:0 14px 10px;font-size:26px;font-weight:800;color:#d9232d}
.price s{font-size:15px;color:#999;font-weight:400;margin-right:6px}
.sec{padding:14px;border-top:8px solid #f3f3f3}
.sec h3{margin:0 0 10px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border:1px solid #e1e1e1;padding:8px;text-align:left;vertical-align:top}
th{background:#fafafa;width:34%;font-weight:600}
.note{font-size:12px;color:#888;margin-top:8px}
</style></head><body>
<div class="page">
 <div class="bar">‹ &nbsp; 상품 상세</div>
 <div class="hero">[상품 이미지]</div>
 <div class="title">모던 3단 오픈 책장 스탠드 선반 화이트 원목 수납장</div>
 <div class="price"><s>69,000원</s>39,900원</div>
 <div class="sec"><h3>상품 정보</h3>
  <table>
   <tr><th>색상</th><td>화이트 / 오크</td></tr>
   <tr><th>재질</th><td>PB, 스틸 프레임</td></tr>
   <tr><th>제품 크기</th><td>가로 60 × 세로 30 × 높이 120cm</td></tr>
   <tr><th>선반 간격</th><td>35cm</td></tr>
   <tr><th>포장 크기</th><td>가로 124 × 세로 32 × 높이 12cm</td></tr>
   <tr><th>무게</th><td>14.2kg</td></tr>
   <tr><th>조립 여부</th><td>조립 상품 (직접 조립)</td></tr>
  </table>
  <div class="note">※ 측정 방법에 따라 1~2cm 오차가 있을 수 있습니다.</div>
 </div>
</div></body></html>
